name: Bug report
description: Something doesn't work, or your bike or frame number isn't recognized
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please run the same command again with **`-debug -redact`** added, and paste that output below.

        `-redact` hides your tokens, keys, private key, certificates and personal data such as your email address, names and IDs. Frame numbers keep only their shape (e.g. `LLLLLLDDDDDLL`), which is enough to fix frame number formats.

        **Never post output from a run without `-redact`, or from `-show-everything`:** anyone with your tokens or keys can unlock your bike.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `./vanmoof-certificates -version`
    validations:
      required: true
  - type: dropdown
    id: bike
    attributes:
      label: Bike
      multiple: true
      options:
        - S5 / A5
        - Series 6 / Series 6 Open
        - S4 / X4 or older
        - Shared with me (guest)
        - Other / not sure
  - type: textarea
    id: output
    attributes:
      label: Output with -debug -redact
      description: The output of the same command with `-debug -redact` added. Check it for anything private before posting.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: The output above comes from a run with `-debug -redact`, and I checked it for anything private
          required: true
